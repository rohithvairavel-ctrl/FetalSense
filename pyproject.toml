[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fetalsense"
version = "0.1.0"
description = "Quality-aware Transformer for fetal ECG extraction and fQRS detection with SSL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rohith Vairavel"}]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "wfdb>=4.1",
]
data = [
    "wfdb>=4.1",
]

[project.scripts]
fetalsense-pretrain = "fetalsense.train.pretrain:main"
fetalsense-finetune = "fetalsense.train.finetune:main"
fetalsense-eval = "fetalsense.train.eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
